<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路径设置页面 - 按钮位置验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 32px 24px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 24px;
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .label {
            display: block;
            color: #cccccc;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input {
            flex: 1;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            min-height: 40px;
        }
        .input:focus {
            border-color: #4a90d9;
            outline: none;
        }
        .browse-btn {
            background-color: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #555555;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .browse-btn:hover {
            background-color: #4a4a4a;
        }
        .select {
            width: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            min-height: 40px;
        }
        .select:focus {
            border-color: #4a90d9;
            outline: none;
        }
        .spacer {
            height: 40px;
        }
        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }
        .install-patch-btn {
            background-color: #3a3a3a;
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 20px;
            min-height: 36px;
            min-width: 140px;
            cursor: pointer;
        }
        .install-patch-btn:hover {
            background-color: #4a4a4a;
            border-color: #666666;
        }
        .install-patch-btn:active {
            background-color: #555555;
        }
        .save-btn {
            background-color: #0078d4;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 24px;
            min-height: 36px;
            min-width: 120px;
            cursor: pointer;
        }
        .save-btn:hover {
            background-color: #106ebe;
        }
        .save-btn:active {
            background-color: #005a9e;
        }
        .highlight {
            position: relative;
        }
        .highlight::after {
            content: "← 新增按钮";
            position: absolute;
            right: -120px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff6b6b;
            font-size: 12px;
            white-space: nowrap;
        }
        .note {
            margin-top: 24px;
            padding: 16px;
            background-color: #2a2a2a;
            border-radius: 4px;
            border-left: 4px solid #0078d4;
        }
        .note-title {
            font-size: 14px;
            font-weight: bold;
            color: #0078d4;
            margin-bottom: 8px;
        }
        .note-content {
            font-size: 13px;
            color: #b0b0b0;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">路径设置页面</div>

        <div class="form-group">
            <label class="label">服务端类型</label>
            <select class="select">
                <option>第三方服务端（Go原版）</option>
                <option>一体式服务端（Python）</option>
            </select>
        </div>

        <div class="form-group">
            <label class="label">第三方服务端路径</label>
            <div class="input-row">
                <input type="text" class="input" placeholder="请选择第三方服务端目录">
                <button class="browse-btn">浏览</button>
            </div>
        </div>

        <div class="form-group">
            <label class="label">客户端路径</label>
            <div class="input-row">
                <input type="text" class="input" placeholder="请选择DNF客户端目录（包含DNF.exe）">
                <button class="browse-btn">浏览</button>
            </div>
        </div>

        <div class="spacer"></div>

        <div class="btn-row">
            <div class="highlight">
                <button class="install-patch-btn">安装客户端补丁</button>
            </div>
            <button class="save-btn">保存</button>
        </div>

        <div class="note">
            <div class="note-title">按钮位置说明</div>
            <div class="note-content">
                "安装客户端补丁"按钮位于页面底部，和"保存"按钮并列显示，在保存按钮的左侧。<br>
                两个按钮都靠右对齐，中间有12px的间距。<br>
                安装补丁按钮：深灰色背景（#3a3a3a），白色文字，1px边框。<br>
                保存按钮：蓝色背景（#0078d4），白色文字，无边框。
            </div>
        </div>
    </div>
</body>
</html>
